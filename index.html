<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TACOS LESSON">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="TACOS LESSON">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>:root{color-scheme:light}body{margin:0;padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}[hidden]{display:none!important}html,body{overscroll-behavior-y:none}</style>
<title>TACOS LESSON</title>
<style>
/* Layout: iOSの「グループ化リスト」の考え方。グレーの地に白いカードを置き、1画面1タスク。黒が主役、赤は花丸と注意だけ */
:root{
  --paper:#f2f2f7; --sheet:#ffffff; --ink:#1c1c1e; --muted:#6e6e73; --line:#e5e5ea;
  --teal:#1c1c1e; --teal-soft:#eeeef0; --stamp:#ff3b30; --stamp-soft:#ffeceb; --gold:#6e6e73;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-en:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --r:16px; --shadow:0 1px 2px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#000000; --sheet:#1c1c1e; --ink:#f5f5f7; --muted:#98989d; --line:#38383a;
  --teal:#f5f5f7; --teal-soft:#2c2c2e; --stamp:#ff453a; --stamp-soft:#3a1c1a; --gold:#98989d; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#000000; --sheet:#1c1c1e; --ink:#f5f5f7; --muted:#98989d; --line:#38383a;
  --teal:#f5f5f7; --teal-soft:#2c2c2e; --stamp:#ff453a; --stamp-soft:#3a1c1a; --gold:#98989d; --shadow:none; color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px calc(100px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3;letter-spacing:-.01em}
h1{font-size:2rem;font-weight:700;letter-spacing:-.02em}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.06rem;font-weight:600}
p{margin:0}
.en{font-family:var(--f-en);font-weight:500;letter-spacing:-.005em}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.label{font-size:.78rem;color:var(--muted);font-weight:500}
button{font:inherit;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}

header{display:flex;flex-direction:column;gap:2px;padding-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--sheet);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.stat b{font-family:var(--f-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-.02em}
.stat b small{font-size:.8rem;font-weight:500;color:var(--muted);letter-spacing:0}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--sheet) 82%,transparent);border-top:.5px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
  -webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px)}
.tab{position:relative;background:none;border:0;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:.66rem;font-weight:500;min-height:50px}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] svg{stroke-width:2.2}
.tdot{position:absolute;top:3px;left:calc(50% + 9px);width:9px;height:9px;border-radius:50%;background:var(--stamp)}

.today{background:var(--sheet);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.today-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--teal-soft);color:var(--muted);font-size:.75rem;font-weight:600}
.chip.red{background:var(--stamp-soft);color:var(--stamp)}
.chip.scene{background:var(--teal-soft);color:var(--muted);margin-left:6px;font-size:.7rem;padding:2px 8px;font-weight:500}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:14px 0;border-bottom:.5px solid var(--line)}
.step:last-child{border-bottom:0}
.step .n{font-family:var(--f-display);font-weight:600;color:var(--muted);width:1.4em;text-align:center}
.step .min{font-size:.75rem;color:var(--muted);white-space:nowrap}
.step.done{opacity:.45}
.step input[type=checkbox]{width:22px;height:22px;accent-color:var(--ink);margin-top:2px}
.phr{display:flex;flex-direction:column;margin-top:8px}
.phr div{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;padding:10px 0;border-bottom:.5px solid var(--line)}
.phr div:last-child{border-bottom:0}
.phr div > span{grid-column:2;min-width:0}
.phr .say{grid-row:1 / span 4;align-self:center}
.phr .en{font-size:1.05rem}
.say{grid-row:span 2;width:40px;height:40px;flex:none;border-radius:50%;border:0;background:var(--teal-soft);color:var(--ink);display:grid;place-items:center;padding:0;transition:transform .1s}
.say:active{transform:scale(.92)}
.say svg{width:18px;height:18px}
.say.playing{background:var(--ink);color:var(--sheet)}
.speed{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.own{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.own input{font:inherit;font-family:var(--f-en);font-size:16px;padding:12px 14px;border-radius:12px;border:0;background:var(--teal-soft);color:var(--ink);width:100%;box-sizing:border-box}

.lesson{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.qz{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:14px;background:var(--teal-soft)}
.qz .ansin,.qz .opt{background:var(--sheet)}
.qz .chip{background:var(--sheet)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:0;background:var(--teal-soft);border-radius:12px;padding:13px 14px;min-height:48px;font-size:1rem}
.opt.right{background:var(--ink);color:var(--sheet);font-weight:600}
.opt.wrong{background:var(--stamp-soft);color:var(--stamp)}
.qres{display:flex;flex-direction:column;gap:8px;min-height:0}
.qres .say{grid-row:auto}
.pick{display:flex;flex-direction:column;gap:6px}
.pick select{font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:0;background:var(--teal-soft);color:var(--ink);max-width:100%;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.pick select + label{margin-top:6px}
.point{background:var(--sheet);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;border-left:3px solid var(--ink)}
.point b{color:var(--muted);font-size:.72rem;font-weight:600}
.seg{display:flex;flex-wrap:nowrap;gap:2px;overflow-x:auto;scrollbar-width:none;background:var(--teal-soft);border-radius:10px;padding:2px}
.seg::-webkit-scrollbar{display:none}
.segbtn{flex:1 0 auto;font-size:.82rem;padding:7px 12px;border:0;border-radius:8px;background:transparent;font-weight:500;color:var(--ink);white-space:nowrap}
.segbtn[aria-pressed="true"]{background:var(--sheet);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.badge{display:inline-grid;place-items:center;min-width:1.4em;height:1.4em;margin-left:5px;border-radius:999px;background:var(--stamp);color:#fff;font-size:.7rem;padding:0 4px}
.prac-body{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.filters .pick select{background-color:var(--sheet)}
.fcard{background:var(--sheet);border-radius:var(--r);padding:22px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.fja{font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1.45;text-wrap:balance;letter-spacing:-.01em}
.fans{display:flex;align-items:center;gap:12px}
.fans .en{font-size:1.25rem;font-weight:600}
.cd{height:4px;border-radius:99px;background:var(--teal-soft);overflow:hidden}
.cd i{display:block;height:100%;background:var(--ink);animation:cd 3s linear forwards}
@keyframes cd{from{width:100%}to{width:0}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{font-size:.82rem;padding:6px 14px}
.card.rev h2{color:var(--stamp)}
.setp{border-radius:12px;background:var(--teal-soft)}
.setp > summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;min-height:44px;box-sizing:border-box}
.setp > summary::-webkit-details-marker{display:none}
.setp > summary .muted::after{content:" ›";display:inline-block;transition:transform .2s;margin-left:2px}
.setp[open] > summary .muted::after{transform:rotate(90deg)}
.setp-in{display:flex;flex-direction:column;gap:12px;padding:2px 14px 14px}
.setp-in .pick select,.setp-in .btn{background-color:var(--sheet)}
.setp-in .btn[aria-pressed="true"]{background:var(--ink)}
.fprog{display:flex;align-items:center}
.dot{width:30px;height:30px;flex:none;border-radius:50%;border:0;background:var(--teal-soft);color:var(--muted);font-family:var(--f-display);font-weight:600;font-size:.85rem;padding:0}
.dot.ok{background:var(--teal-soft);color:var(--ink)}
.dot.cur{background:var(--ink);color:var(--sheet)}
.dline{flex:1;height:2px;border-radius:2px;background:var(--teal-soft);min-width:12px}
.fstep{display:block;border:0;padding:2px 0 0}
.fstep h3{font-size:1.3rem;font-weight:700;margin-top:2px}
.fnav{display:grid;grid-template-columns:auto 1fr;gap:10px;position:sticky;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:5;padding:14px 0 6px;margin-bottom:-6px;background:linear-gradient(to bottom,transparent,var(--sheet) 14px)}
.fnav .btn{min-height:52px;font-size:1.02rem;border-radius:14px}
.btn:disabled{opacity:.35;cursor:default}
.fdone{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:16px 0 4px}
.fdone-mark{width:64px;height:64px;border-radius:50%;background:var(--stamp);color:#fff;display:grid;place-items:center;font-size:0}
.fdone-mark::after{content:"";width:22px;height:12px;border-left:4px solid #fff;border-bottom:4px solid #fff;transform:translateY(-3px) rotate(-45deg)}
.fcard.swipe{position:relative;touch-action:pan-y;transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .2s;will-change:transform}
.swhint{display:flex;justify-content:space-between;font-size:.75rem}
.swl{position:absolute;top:16px;padding:4px 12px;border-radius:999px;font-weight:700;font-size:.9rem;opacity:0;transition:opacity .15s;pointer-events:none;color:#fff}
.swl-ok{right:16px;background:var(--ink);color:var(--sheet)}
.swl-ng{left:16px;background:var(--stamp)}
.fcard.go-ok .swl-ok,.fcard.go-ng .swl-ng{opacity:1}
.fcard.auto{text-align:center;align-items:stretch}
.auen{font-size:1.6rem;font-weight:600;line-height:1.35;text-wrap:balance;min-height:2.8em;display:grid;place-items:center}
.auja{font-size:1rem;color:var(--muted);min-height:1.6em}
.fcard.auto.playing .auen{color:var(--ink)}
.fcard.auto .fnav{position:static}
.ansrow{display:flex;gap:8px;align-items:stretch}
.inwrap{position:relative;flex:1;min-width:0;display:flex}
.ansin{flex:1;min-width:0;font:inherit;font-family:var(--f-en);font-size:17px;padding:13px 50px 13px 14px;border-radius:12px;border:0;background:var(--teal-soft);color:var(--ink)}
.micbtn{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;padding:0}
.micbtn svg{width:20px;height:20px}
.micbtn.rec{background:var(--stamp);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--stamp-soft)}}
.ansrow .btn{flex:none;min-height:48px;border-radius:12px}
.qtools{display:flex;flex-wrap:wrap;gap:4px 18px}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--muted);font-size:.85rem;font-weight:500}
.res{margin:0;font-weight:700}
.res.ok{color:var(--ink)}
.res.ng{color:var(--stamp)}
mark{background:var(--stamp-soft);color:var(--stamp);border-radius:4px;padding:0 2px}
.oka .lesson{margin-top:0}
.ordans{min-height:50px;display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-radius:12px;background:var(--sheet);align-items:center}
.ordend{font-size:1.1rem;margin-left:4px;color:var(--muted);display:none}
.ordbank{display:flex;flex-wrap:wrap;gap:6px}
.chipw{border:0;border-radius:10px;padding:9px 12px;font-size:1rem;background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ordans .chipw{background:var(--ink);color:var(--sheet)}
.blank{font-size:1.1rem}
.timer{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:0;background:var(--teal-soft);padding:9px 16px;border-radius:999px;font-weight:600;font-size:.92rem;color:var(--ink);transition:transform .1s,opacity .1s}
.btn:active{transform:scale(.97);opacity:.85}
.btn.primary,.speed .btn[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.btn.stampbtn{background:var(--stamp);color:#fff}
.btn .ic{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
.clock{font-family:var(--f-en);font-weight:600;font-size:1.3rem;font-variant-numeric:tabular-nums;min-width:4ch}
.finish{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.extras{border-top:.5px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}

.card{background:var(--sheet);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;max-width:360px;width:100%}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cal .d.on{background:var(--stamp);color:#fff;font-weight:700;font-size:0}
.cal .d.on::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-1px) rotate(-45deg)}
.cal .d.now{box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink);font-weight:600}
.cal .wd{font-size:.7rem;text-align:center;color:var(--muted)}

.bookh{font-size:1.5rem;margin:14px 0 2px;letter-spacing:-.02em}
details.phase{background:var(--sheet);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
details.phase > summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:10px}
details.phase > summary::-webkit-details-marker{display:none}
.phase-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.phase-head h3{font-size:1.05rem}
.phase-in{display:flex;flex-direction:column;gap:8px;margin-top:14px}
details.phase details.topic{background:var(--teal-soft);box-shadow:none}
details.topic summary .sub{display:block;font-size:.75rem;color:var(--muted);font-weight:400}
.pg{font-size:.72rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .3s}
.goal{font-size:.8rem;color:var(--muted);margin-top:2px}
details.topic{border-radius:12px;background:var(--sheet);box-shadow:var(--shadow)}
details.topic summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;min-height:48px;box-sizing:border-box}
details.topic summary::-webkit-details-marker{display:none}
details.topic summary input{width:22px;height:22px;accent-color:var(--ink);flex:none}
details.topic summary .t{flex:1;min-width:0;font-weight:500}
details.topic summary .now{font-size:.72rem;background:var(--ink);color:var(--sheet)}
details.topic .inner{padding:0 14px 14px 48px;display:flex;flex-direction:column;gap:8px}
details.topic.is-done summary .t{color:var(--muted)}
.tip{display:block;font-size:.85rem;color:var(--muted);margin-top:2px}

.weekly{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.weekly div{background:var(--teal-soft);border-radius:12px;padding:12px 14px}
.copybox{font-size:.85rem;background:var(--teal-soft);border-radius:12px;padding:12px 14px;white-space:pre-wrap;user-select:all}
.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--ink) 92%,transparent);color:var(--sheet);padding:10px 18px;border-radius:999px;font-size:.88rem;font-weight:600;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);max-width:calc(100% - 32px);text-align:center}
.save-note{font-size:.75rem;text-align:center}
@media (max-width:420px){.stat b{font-size:1.35rem}.step{grid-template-columns:auto 1fr}.step .min{grid-column:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <span class="label" id="hdrDate">1日5〜10分</span>
    <h1>TACOS LESSON</h1>
  </header>

  <div class="stats">
    <div class="stat"><span class="label">つづけた日</span><b id="sStreak">0<small> 日</small></b></div>
    <div class="stat"><span class="label">今週</span><b id="sWeek">0<small> / 5日</small></b></div>
    <div class="stat"><span class="label">すすみ</span><b id="sProg">0<small>%</small></b></div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-today" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/><path d="M9 15l2 2 4-4"/></svg><span>今日</span></button>
    <button class="tab" role="tab" id="tab-prac" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v10H9l-4 4z"/><path d="M9 9h6M9 12h4"/></svg><span>練習</span><i class="tdot" id="tabDot" hidden></i></button>
    <button class="tab" role="tab" id="tab-road" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20c0-6 14-4 14-10a4 4 0 0 0-8 0"/><circle cx="5" cy="20" r="1.5"/><path d="M15 3l4 3-4 3"/></svg><span>ぜんたいの道</span></button>

const LS="eigo-road-v1";
let S={done:{},days:{},own:{},steps:{},book:true};
let db=null, docRef=null, saveTimer=null, storeKind="この端末";
function defaults(){}
function migrate(){if(S.ver!==2){S.done={}; S.ver=2; save();}}
try{const raw=localStorage.getItem(LS); if(raw) S=Object.assign(S,JSON.parse(raw)); else defaults();}catch(e){defaults();}
migrate();
function save(){
  try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
  if(docRef){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{docRef.set({state:JSON.stringify(S),at:Date.now()}).catch(()=>{});},600);}
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!d||!u) return; const id=await u.id(); if(!id) return;
    db=d; docRef=db.doc("data/users/"+id+"/progress/main");
    const snap=await docRef.get();
    if(snap.exists){const v=snap.data(); try{S=Object.assign({done:{},days:{},own:{},steps:{}},JSON.parse(v.state));}catch(e){}}
    else save();
    migrate();
    storeKind="あなたのアカウント"; render();
  }catch(e){}
})();

const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>key(new Date());
function streak(){let n=0,d=new Date(); if(!S.days[key(d)]) d.setDate(d.getDate()-1);
  while(S.days[key(d)]){n++;d.setDate(d.getDate()-1);} return n;}
function weekCount(){const d=new Date(); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); let n=0;
  for(let i=0;i<7;i++){if(S.days[key(d)])n++; d.setDate(d.getDate()+1);} return n;}

const canSpeak=()=>{try{return "speechSynthesis" in window && typeof SpeechSynthesisUtterance!=="undefined";}catch(e){return false;}};
const rate=()=>S.rate||0.9;
function enVoice(){try{const vs=speechSynthesis.getVoices();return vs.find(v=>/en-US/i.test(v.lang)&&/Samantha|Google US|Aria|Jenny/i.test(v.name))||vs.find(v=>/en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));}catch(e){return null;}}
try{if(canSpeak()) speechSynthesis.onvoiceschanged=()=>{};}catch(e){}
function speak(text,btn){
  if(!canSpeak()){toast("このブラウザでは音声が使えません");return;}
  try{speechSynthesis.cancel(); document.querySelectorAll(".say.playing").forEach(b=>b.classList.remove("playing"));
    const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=rate(); const v=enVoice(); if(v) u.voice=v;
    if(btn){btn.classList.add("playing"); u.onend=u.onerror=()=>btn.classList.remove("playing");}
    speechSynthesis.speak(u);}catch(e){toast("音声を出せませんでした");}

  if(q.ty==="order") body=`<p class="small"><b>「${esc(x[3])}」</b></p><div class="ordans" aria-label="答え"></div><span class="ordend en">${esc(end)}</span><div class="ordbank">${q.bank.map((w,j)=>`<button type="button" class="chipw en" data-j="${j}">${esc(w)}</button>`).join("")}</div><div class="finish"><button type="button" class="btn primary okcheck">答え合わせ</button><button type="button" class="linkbtn okgive">答えを見る</button></div>`;
  else if(q.ty==="blank"){ const w=stripEnd(ans).split(" "); const shown=w.map((v,j)=>j===q.b?"＿＿＿":esc(v)).join(" ")+esc(end);
    body=`<p class="small"><b>「${esc(x[3])}」</b></p><p class="en blank">${shown}</p><form class="ansrow okform"><span class="inwrap"><input class="ansin" id="ok-${OK.round}-${i}" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" lang="en" enterkeyhint="done" aria-label="答え"><button type="button" class="micbtn" aria-label="話して答える">${MICSVG}</button></span><button class="btn primary">答え合わせ</button></form><div class="qtools"><button type="button" class="linkbtn okgive">答えを見る</button></div>`;}
  else if(q.ty==="dict") body=`<div class="finish"><button type="button" class="btn okplay">▶ 聞く</button><button type="button" class="btn okslow">ゆっくり</button></div><form class="ansrow okform"><span class="inwrap"><input class="ansin" id="ok-${OK.round}-${i}" type="text" autocomplete="off" autocapitalize="sentences" spellcheck="false" lang="en" enterkeyhint="done" aria-label="答え"><button type="button" class="micbtn" aria-label="話して答える">${MICSVG}</button></span><button class="btn primary">答え合わせ</button></form><div class="qtools"><button type="button" class="linkbtn okhint">意味を見る</button><button type="button" class="linkbtn okgive">答えを見る</button></div><p class="small muted okja" hidden>意味：${esc(x[3])}</p>`;
  else body=`<p class="small"><b>「${esc(x[3])}」</b></p><form class="ansrow okform"><span class="inwrap"><input class="ansin" id="ok-${OK.round}-${i}" type="text" autocomplete="off" autocapitalize="sentences" spellcheck="false" lang="en" enterkeyhint="done" aria-label="答え"><button type="button" class="micbtn" aria-label="話して答える">${MICSVG}</button></span><button class="btn primary">答え合わせ</button></form><div class="qtools"><button type="button" class="linkbtn okgive">答えを見る</button></div>`;
  return `<div class="qz okq" data-i="${i}"><p class="small"><span class="chip">${i+1}. ${OKLABEL[q.ty]}</span> <span class="chip scene">${esc(x[6])}</span></p>${body}<div class="small qres"></div></div>`;}
function renderOkawari(t){ const box=$("okaBox"); if(!box) return;
  if(!LESSON[t.id]||t.p==="p4"){box.innerHTML=""; return;}
  if(OK.tid!==t.id){OK.tid=t.id; OK.round=0; OK.qs=[];}
  box.innerHTML=`<div class="card oka"><div class="today-head"><h2>おかわり</h2><span class="small muted">${OK.round?OK.round+"回目":"5問"}</span></div>
   ${OK.qs.length?`<div class="lesson">${OK.qs.map(okaQ).join("")}</div>`:`<p class="small muted">もっと練習したいときに。並べかえ・穴うめ・聞いて書くなど、形をかえて5問出ます。</p>`}
   <div><button class="btn ${OK.qs.length?"":"primary"}" id="okaGo">${OK.qs.length?"もう5問おかわり":"おかわりする"}</button></div></div>`;
  $("okaGo").onclick=()=>{OK.qs=makeOkawari(t); OK.round++; renderOkawari(t); const c=box.querySelector(".oka"); if(c) c.scrollIntoView({behavior:"smooth",block:"start"});};
  box.querySelectorAll(".okq").forEach(el=>{ const q=OK.qs[+el.dataset.i]; const ans=q.x[2]; const pt=(POINT[q.k.split(":")[1]]||[])[+q.k.split(":")[2]]||"";
    const done=(ok,typed,give)=>{ if(el.dataset.ans) return; el.dataset.ans=1; el.querySelectorAll(".okform,.qtools,.ordbank,.finish").forEach(n=>n.hidden=true);
      if(!ok){ addMiss(q.k); renderPractice(); try{$("tabDot").hidden=!dueKeys().length;}catch(e){} }
      el.querySelector(".qres").innerHTML=resultHtml(ans,ok,typed,give)+(pt?`<p class="point small"><b>ワンポイント</b>${esc(pt)}</p>`:""); speak(ans); };
    const f=el.querySelector(".okform");
    if(f) f.onsubmit=e=>{e.preventDefault(); const v=f.querySelector("input").value.trim(); if(!v){toast("答えを入れてください"); return;} f.querySelector("input").blur();
      if(q.ty==="blank"){ const w=stripEnd(ans).split(" "); w[q.b]=v; done(isMatch(w.join(" "),ans), w.join(" "), false); } else done(isMatch(v,ans), v, false); };
    const g=el.querySelector(".okgive"); if(g) g.onclick=()=>done(false,"",true);
    const h=el.querySelector(".okhint"); if(h) h.onclick=()=>{el.querySelector(".okja").hidden=false; h.hidden=true;};
    const pl=el.querySelector(".okplay"); if(pl) pl.onclick=()=>speak(ans);
    const sl=el.querySelector(".okslow"); if(sl) sl.onclick=()=>{const r=S.rate; S.rate=0.6; speak(ans); S.rate=r;};
    if(q.ty==="order"){ const bank=el.querySelector(".ordbank"), out=el.querySelector(".ordans");
      el.querySelectorAll(".chipw").forEach(c=>c.onclick=()=>{ if(el.dataset.ans) return; (c.parentNode===bank?out:bank).appendChild(c); });
      el.querySelector(".okcheck").onclick=()=>{ const v=[...out.querySelectorAll(".chipw")].map(c=>c.textContent).join(" "); if(!v){toast("単語をタップして並べてください"); return;} done(isMatch(v,ans), v+((ans.match(/[.?!]+$/)||[""])[0]), false); };}
  });}

function focusHtml(steps,st,fi,doneToday){
  const dots=`<div class="fprog">${steps.map((s,i)=>`<button class="dot ${st[s.k]?"ok":""} ${i===fi?"cur":""}" data-fi="${i}" aria-label="ステップ${i+1}${st[s.k]?"（できた）":""}">${st[s.k]&&i!==fi?"✓":i+1}</button>`).join('<i class="dline"></i>')}</div>`;
  if(fi>=steps.length) return `${dots}<div class="fdone"><p class="fdone-mark">花</p><h3>今日のメニュー、全部できました</h3><p class="small muted">おつかれさまでした。時間があれば「練習」タブの瞬間英作文を5問だけどうぞ。</p><div><button class="btn" id="fAgain">もう一度見る</button></div></div>`;
  const s=steps[fi], last=fi===steps.length-1;
  return `${dots}<ol class="steps"><li class="step fstep"><div class="body"><p class="small muted">ステップ ${fi+1} / ${steps.length}・${s.min}</p><h3>${s.h}</h3>${s.b}</div></li></ol>
  <div class="fnav"><button class="btn" id="fBack" ${fi===0?"disabled":""}>もどる</button><button class="btn primary fgo" id="fNext">${last?"できた！":"できた → 次へ"}</button></div>`;}
function calendar(){
  const d=new Date(); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w-28); let h=["月","火","水","木","金","土","日"].map(x=>`<span class="wd">${x}</span>`).join("");
  for(let i=0;i<35;i++){const k=key(d); const fut=d>new Date(); h+=`<span class="d ${S.days[k]?"on":""} ${k===today()?"now":""}" title="${k}">${S.days[k]?"花":fut?"":d.getDate()}</span>`; d.setDate(d.getDate()+1);}
  return `<div class="cal">${h}</div>`;
}
let tEnd=0,tInt=null;
function startTimer(sec){tEnd=Date.now()+sec*1000; clearInterval(tInt); tInt=setInterval(showClock,500); showClock();}
function showClock(){const c=$("clock"); if(!c) return; if(!tEnd){c.textContent="";return;} const r=Math.max(0,Math.round((tEnd-Date.now())/1000));
  c.textContent=Math.floor(r/60)+":"+pad(r%60); if(r===0){clearInterval(tInt);tEnd=0;c.textContent="おわり！";toast("時間です。花丸を押しましょう");}}

const addDays=n=>{const d=new Date(); d.setDate(d.getDate()+n); return key(d);};
function itemByKey(k){const a=k.split(":");
  if(a[0]==="L"){const x=LESSON[a[1]]&&LESSON[a[1]][+a[2]]; if(!x) return null; const t=T.find(z=>z.id===a[1]); return {k,en:x[2],ja:x[3],scene:x[6],pt:(POINT[a[1]]||[])[+a[2]]||"",label:(t?t.name.split("（")[0]:"")+" ／ "+x[0]};}
  const x=PHRASES[a[1]]&&PHRASES[a[1]][+a[2]]; if(!x) return null; return {k,en:x[0],ja:x[1],scene:a[1],pt:"",label:"フレーズ集"};}
function addMiss(k){if(!k) return; S.miss=S.miss||{}; S.miss[k]={s:0,due:addDays(1)}; save();}
function dueKeys(){const m=S.miss||{}; return Object.keys(m).filter(k=>m[k].due<=today()&&itemByKey(k));}
function reviewDone(k,ok){S.miss=S.miss||{}; const m=S.miss[k]; if(!m) return; if(ok){const s=m.s+1; if(s>=4) delete S.miss[k]; else S.miss[k]={s,due:addDays([1,3,7,14][s])};} else S.miss[k]={s:0,due:addDays(1)}; save();}

function poolKeys(){let ks=[]; const r=PR.range;
  if(r==="today"||r==="done"||r==="all"){const ts=r==="today"?[todayTopic()]:T.filter(t=>LESSON[t.id]&&!t.rt&&(S.done[t.id]||t===current())); ts.forEach(t=>(LESSON[t.id]||[]).forEach((x,i)=>ks.push("L:"+t.id+":"+i)));}
  if(r==="phrase"||r==="all"){Object.keys(PHRASES).forEach(sc=>PHRASES[sc].forEach((x,i)=>ks.push("F:"+sc+":"+i)));}
  if(PR.scene!=="全部") ks=ks.filter(k=>{const it=itemByKey(k); return it&&it.scene===PR.scene;});
  return ks;}

  <p class="small muted"><span class="chip scene">${esc(it.scene)}</span> ${esc(it.label)}</p>
  <p class="fja">${esc(it.ja)}</p>
  ${shown?`${PR.typed?resultHtml(it.en,PR.typed.ok,PR.typed.text,false):`<div class="fans">${sayBtn(it.en)}<span class="en">${esc(it.en)}</span></div>`}${it.pt?`<p class="point small"><b>ワンポイント</b>${esc(it.pt)}</p>`:""}${btns}<p class="swhint small muted"><span>← 左へ：まだ</span><span>右へ：言えた →</span></p><span class="swl swl-ok" aria-hidden="true">言えた</span><span class="swl swl-ng" aria-hidden="true">まだ</span>`:
  `<div class="cd"><i></i></div><form class="ansrow" id="fForm"><span class="inwrap"><input class="ansin" aria-label="答え" id="fIn" type="text" autocomplete="off" autocapitalize="sentences" spellcheck="false" lang="en" enterkeyhint="done"><button type="button" class="micbtn" aria-label="話して答える"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button></span><button class="btn primary">答え合わせ</button></form><div class="qtools"><button type="button" class="linkbtn" id="fShow">答えを見る</button></div>`}
  </div>`;}

function renderPractice(){
  const due=dueKeys().length;
  const modes=[["flash","瞬間英作文"],["review","復習"+(due?`<span class="badge">${due}</span>`:"")],["phrase","フレーズ集"],["listen","聞き取り"],["auto","聞き流し"]];
  let body="";
  if(PR.mode==="flash"){
    const ks=poolKeys(); if(!PR.cur||!ks.includes(PR.cur)){PR.cur=pickOne(ks); PR.shown=false;}
    const it=PR.cur&&itemByKey(PR.cur);
    body=`<p class="small muted">日本語を見て、すぐ英語で。</p>${rangeBar()}
    ${it?cardHtml(it,PR.shown,`<div class="finish"><button class="btn primary" id="fOk">言えた</button><button class="btn" id="fNg">言えなかった（復習に入れる）</button></div>`):'<p class="muted">この条件の問題がありません。場面を「全部」にしてみてください。</p>'}
    <p class="small muted">今日ここで ${PR.count} 問やりました。</p>`;
  } else if(PR.mode==="review"){
    const ks=dueKeys(); const total=Object.keys(S.miss||{}).length;
    if(!ks.length){body=`<div class="fcard"><p class="fja">今日の復習はありません</p><p class="small muted">クイズや聞き取りでまちがえた問題、瞬間英作文で言えなかった問題がここに入ります。<br>1日後 → 3日後 → 7日後 → 14日後と、間をあけてもう一度出てきます。4回言えたら卒業です。</p><p class="small">復習リストにあるのは全部で <b>${total}</b> こです。</p></div>`;}
    else{ if(!PR.cur||!ks.includes(PR.cur)){PR.cur=ks[0]; PR.shown=false;} const it=itemByKey(PR.cur); const st=(S.miss[PR.cur]||{}).s||0;
      body=`<p class="small muted">今日の復習：のこり <b>${ks.length}</b> こ（卒業まであと ${4-st} 回）</p>${cardHtml(it,PR.shown,`<div class="finish"><button class="btn primary" id="rOk">言えた</button><button class="btn" id="rNg">まだ</button></div>`)}`;}
  } else if(PR.mode==="phrase"){
    const sc=PR.scene!=="全部"&&PHRASES[PR.scene]?PR.scene:Object.keys(PHRASES)[0];
    body=`<p class="small muted">そのまま使える決まり文句。</p>
    <div class="chips">${Object.keys(PHRASES).map(x=>`<button class="btn chipbtn" data-ps="${esc(x)}" aria-pressed="${x===sc}">${esc(x)}</button>`).join("")}</div>
    <div class="phr">${PHRASES[sc].map(p=>`<div>${sayBtn(p[0])}<span class="en">${esc(p[0])}</span><span class="small muted">${esc(p[1])}</span></div>`).join("")}</div>
    <div><button class="btn primary" id="phFlash">この場面で瞬間英作文をする</button></div>`;
  } else if(PR.mode==="listen"){
    const ks=poolKeys();
    if(!PR.lis||!ks.includes(PR.lis.k)){const k=pickOne(ks, PR.lastK); if(k){const it=itemByKey(k); const others=shuffle(ks.filter(x=>x!==k).map(itemByKey).filter(o=>o&&o.ja!==it.ja)).slice(0,2).map(o=>o.ja); PR.lis={k,res:null,hint:false};} else PR.lis=null;}
    const L=PR.lis, it=L&&itemByKey(L.k);
    body=`<p class="small muted">聞こえた英語を書く。</p>${rangeBar()}
    ${it?`<div class="fcard"><div class="finish"><button class="btn primary" id="lPlay">▶ 聞く</button><button class="btn" id="lSlow">ゆっくり聞く</button></div>
      ${L.res?`${resultHtml(it.en,L.res.ok,L.res.text,L.res.give)}<p class="small muted">意味：${esc(it.ja)}</p><div><button class="btn primary" id="lNext">次へ</button></div>`:
      `<form class="ansrow" id="lForm"><span class="inwrap"><input class="ansin" aria-label="答え" id="lIn" type="text" autocomplete="off" autocapitalize="sentences" spellcheck="false" lang="en" enterkeyhint="done"><button type="button" class="micbtn" aria-label="話して答える"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button></span><button class="btn primary">答え合わせ</button></form>
      <div class="qtools"><button type="button" class="linkbtn" id="lHint" ${L.hint?"hidden":""}>意味を見る</button><button type="button" class="linkbtn" id="lGive">答えを見る</button></div>${L.hint?`<p class="small muted">意味：${esc(it.ja)}</p>`:""}`}</div>`:'<p class="muted">この条件の問題がありません。</p>'}`;
  } else if(PR.mode==="auto"){
    const A=PR.auto; const ks=poolKeys(); if(!A.list.length||A.sig!==PR.range+PR.scene){A.list=shuffle(ks); A.i=0; A.sig=PR.range+PR.scene;}
    const it=A.list.length&&itemByKey(A.list[A.i]);
    body=`<p class="small muted">英語と日本語を、つぎつぎに読み上げます。</p>${rangeBar()}
    <div class="fcard auto ${A.on?"playing":""}">
      <p class="small muted"><span id="auCount">${A.list.length?(A.i+1)+" / "+A.list.length:"0"}</span>　<span class="chip scene" id="auScene">${it?esc(it.scene):""}</span></p>
      <p class="auen en" id="auEn">${it?esc(it.en):"この条件の文がありません"}</p>
      <p class="auja" id="auJa">${it?esc(it.ja):""}</p>
      <div class="fnav"><button class="btn primary fgo" id="auPlay" ${A.list.length?"":"disabled"}>${A.on?"■ 止める":"▶ 聞き流す"}</button><button class="btn" id="auNext" ${A.list.length?"":"disabled"}>次へ ⏭</button></div>
    </div>
    <div class="speed"><span class="small muted">読み方：</span><button class="btn" id="auJaT" aria-pressed="${A.ja}">日本語も読む</button><button class="btn" id="auTwT" aria-pressed="${A.twice}">英語を2回</button><button class="btn" id="auGapT" aria-pressed="${A.gap>2000}">間を長く</button></div>
    <p class="small muted">画面を消すと、音が止まることがあります。</p>`;
  }
  $("pane-prac").innerHTML=`<div class="seg" role="group" aria-label="練習のしゅるい">${modes.map(m=>`<button class="btn segbtn" data-mode="${m[0]}" aria-pressed="${PR.mode===m[0]}">${m[1]}</button>`).join("")}</div><div class="prac-body">${body}</div>`;
  bindPractice();
}
function jaVoice(){try{const vs=speechSynthesis.getVoices();return vs.find(v=>/ja/i.test(v.lang)&&/Kyoko|O-ren|Google/i.test(v.name))||vs.find(v=>/^ja/i.test(v.lang));}catch(e){return null;}}
function sayP(text,lang,r){return new Promise(res=>{if(!canSpeak()){setTimeout(res,800);return;} let done=false; const fin=()=>{if(!done){done=true;res();}};
  try{const u=new SpeechSynthesisUtterance(text); u.lang=lang; u.rate=r; const v=lang==="ja-JP"?jaVoice():enVoice(); if(v) u.voice=v; u.onend=fin; u.onerror=fin; speechSynthesis.speak(u); setTimeout(fin,Math.max(6000,text.length*250));}catch(e){fin();}});}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function autoShow(){const A=PR.auto, it=itemByKey(A.list[A.i]); if(!it) return; const q=id=>document.getElementById(id);
  if(q("auEn")) q("auEn").textContent=it.en; if(q("auJa")) q("auJa").textContent=it.ja; if(q("auCount")) q("auCount").textContent=(A.i+1)+" / "+A.list.length; if(q("auScene")) q("auScene").textContent=it.scene;}
async function autoStart(){const A=PR.auto; if(!A.list.length) return; A.on=true; const tok=++A.tok; renderPractice();
  try{ if(navigator.wakeLock) A.lock=await navigator.wakeLock.request("screen"); }catch(e){}
  while(A.on&&A.tok===tok){const it=itemByKey(A.list[A.i]); if(!it) break; autoShow();
    await sayP(it.en,"en-US",rate()); if(A.tok!==tok) break; await wait(A.gap); if(A.tok!==tok) break;
    if(A.ja){await sayP(it.ja,"ja-JP",1.0); if(A.tok!==tok) break; await wait(A.gap); if(A.tok!==tok) break;}
    if(A.twice){await sayP(it.en,"en-US",rate()); if(A.tok!==tok) break; await wait(A.gap); if(A.tok!==tok) break;}
    A.i=(A.i+1)%A.list.length; if(A.i===0) A.list=shuffle(A.list);}
}
function autoStop(){const A=PR.auto; if(!A.on) return; A.on=false; A.tok++; try{speechSynthesis.cancel();}catch(e){} try{A.lock&&A.lock.release();}catch(e){} A.lock=null; if(PR.mode==="auto") renderPractice();}
document.addEventListener("visibilitychange",async()=>{const A=PR.auto; if(A.on&&document.visibilityState==="visible"&&navigator.wakeLock){try{A.lock=await navigator.wakeLock.request("screen");}catch(e){}}});
function bindSwipe(){const c=$("fcard"); if(!c||!c.classList.contains("swipe")) return;
  const ok=$("fOk")||$("rOk"), ng=$("fNg")||$("rNg"); if(!ok||!ng) return;
  let x0=0,y0=0,dx=0,drag=false,lock=null;
  c.addEventListener("touchstart",e=>{const t=e.touches[0]; x0=t.clientX; y0=t.clientY; dx=0; drag=true; lock=null; c.style.transition="none";},{passive:true});
  c.addEventListener("touchmove",e=>{if(!drag) return; const t=e.touches[0]; const mx=t.clientX-x0, my=t.clientY-y0;
    if(lock===null&&(Math.abs(mx)>8||Math.abs(my)>8)) lock=Math.abs(mx)>Math.abs(my)?"x":"y";
    if(lock!=="x") return; dx=mx; c.style.transform=`translateX(${dx}px) rotate(${dx/30}deg)`;
    c.classList.toggle("go-ok",dx>60); c.classList.toggle("go-ng",dx<-60);},{passive:true});
  const end=()=>{if(!drag) return; drag=false; c.style.transition="";
    if(lock==="x"&&Math.abs(dx)>90){c.style.transform=`translateX(${dx>0?120:-120}%) rotate(${dx>0?12:-12}deg)`; c.style.opacity="0"; PR.swiped=true; setTimeout(()=>(dx>0?ok:ng).click(),160);}
    else{c.style.transform=""; c.classList.remove("go-ok","go-ng");}};
  c.addEventListener("touchend",end); c.addEventListener("touchcancel",end);}
function nextCard(){PR.cur=null; PR.shown=false; PR.typed=null; renderPractice(); const f=$("fIn"); if(f&&!PR.swiped) f.focus(); PR.swiped=false;}
function bindPractice(){
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{if(b.dataset.mode!=="auto") autoStop(); PR.mode=b.dataset.mode; PR.cur=null; PR.shown=false; renderPractice();});
  if($("prRange")) $("prRange").onchange=e=>{autoStop(); PR.range=e.target.value; PR.cur=null; PR.lis=null; renderPractice();};
  if($("prScene")) $("prScene").onchange=e=>{autoStop(); PR.scene=e.target.value; PR.cur=null; PR.lis=null; renderPractice();};
  if($("fShow")) $("fShow").onclick=()=>{PR.typed=null; PR.shown=true; renderPractice(); const it=itemByKey(PR.cur); if(it) speak(it.en);};
  if($("fForm")) $("fForm").onsubmit=e=>{e.preventDefault(); const v=$("fIn").value.trim(); if(!v){toast("答えを入れてください"); return;} const it=itemByKey(PR.cur); PR.typed={text:v,ok:isMatch(v,it.en)}; PR.shown=true; $("fIn").blur(); renderPractice(); speak(it.en);};
  if($("fOk")) $("fOk").onclick=()=>{PR.count++; nextCard();};
  if($("fNg")) $("fNg").onclick=()=>{addMiss(PR.cur); PR.count++; toast("復習に入れました。明日また出ます"); nextCard(); renderToday();};
  if($("rOk")) $("rOk").onclick=()=>{reviewDone(PR.cur,true); toast("いいね！"); nextCard(); renderToday();};
  if($("rNg")) $("rNg").onclick=()=>{reviewDone(PR.cur,false); toast("明日もう一度出ます"); nextCard(); renderToday();};
  document.querySelectorAll("[data-ps]").forEach(b=>b.onclick=()=>{PR.scene=b.dataset.ps; renderPractice();});
  if($("phFlash")) $("phFlash").onclick=()=>{const sc=document.querySelector('[data-ps][aria-pressed="true"]').dataset.ps; PR.mode="flash"; PR.range="phrase"; PR.scene=sc; nextCard();};
  bindSwipe();
  if($("auPlay")) $("auPlay").onclick=()=>{PR.auto.on?autoStop():autoStart(); };
  if($("auNext")) $("auNext").onclick=()=>{const A=PR.auto; const was=A.on; autoStop(); A.i=(A.i+1)%A.list.length; renderPractice(); if(was) autoStart(); else {const it=itemByKey(A.list[A.i]); if(it) speak(it.en);}};
  if($("auJaT")) $("auJaT").onclick=()=>{PR.auto.ja=!PR.auto.ja; renderPractice();};
  if($("auTwT")) $("auTwT").onclick=()=>{PR.auto.twice=!PR.auto.twice; renderPractice();};
  if($("auGapT")) $("auGapT").onclick=()=>{PR.auto.gap=PR.auto.gap>2000?1500:3000; renderPractice();};
  const it=PR.lis&&itemByKey(PR.lis.k);
  if($("lPlay")) $("lPlay").onclick=()=>speak(it.en);
  if($("lSlow")) $("lSlow").onclick=()=>{const r=S.rate; S.rate=0.6; speak(it.en); S.rate=r;};
  if($("lForm")) $("lForm").onsubmit=e=>{e.preventDefault(); const v=$("lIn").value.trim(); if(!v){toast("答えを入れてください"); return;} const ok=isMatch(v,it.en); PR.lis.res={ok,text:v}; if(!ok) addMiss(PR.lis.k); $("lIn").blur(); renderPractice(); if(!ok) renderToday();};
  if($("lHint")) $("lHint").onclick=()=>{PR.lis.hint=true; renderPractice();};
  if($("lGive")) $("lGive").onclick=()=>{PR.lis.res={ok:false,text:"",give:true}; addMiss(PR.lis.k); renderPractice(); renderToday(); speak(it.en);};
  if($("lNext")) $("lNext").onclick=()=>{PR.lastK=PR.lis.k; PR.lis=null; renderPractice(); const n=PR.lis&&itemByKey(PR.lis.k); if(n) speak(n.en); const f=$("lIn"); if(f) f.focus();};
}

function render(){renderStats(); try{$("tabDot").hidden=!dueKeys().length;}catch(e){}renderToday();renderRoad();renderHow();renderPractice();
  $("saveNote").textContent="記録は"+storeKind+"に保存されます。"+(storeKind==="この端末"?"ほかのスマホやPCでは見られません。":"スマホでもPCでも見られます。");}
const tabs={"tab-today":"pane-today","tab-prac":"pane-prac","tab-road":"pane-road","tab-how":"pane-how"};
Object.keys(tabs).forEach(id=>$(id).onclick=()=>{const was=$(id).getAttribute("aria-selected")==="true"; Object.entries(tabs).forEach(([t,p])=>{$(t).setAttribute("aria-selected",t===id);$(p).hidden=t!==id;}); window.scrollTo({top:0,behavior:was?"smooth":"auto"});});
render();
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
